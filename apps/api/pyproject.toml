[project]
name = "codonlab-api"
version = "0.1.0"
description = "Codon Lab API — protein design copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "redis>=5.2.1",
    "rq>=2.1.0",
    # Promoted from a test-only dependency: Phase 2 retrieves sequences and
    # structures from UniProt, RCSB and AlphaFold DB at runtime. It was already
    # present because FastAPI's TestClient is built on it.
    "httpx>=0.28.1",
    # Goal parsing only. It turns free text into the structured objective the
    # user confirms; it never produces a scientific number. The deterministic
    # fallback in codonlab.parsers.rules runs whenever no key is configured.
    "anthropic>=0.69.0",
    # Solvent accessibility (Shrake-Rupley) with the ProtOr radii of Tsai et al.
    # 1999. Deliberately not hand-rolled: the hidden parameter in a SASA
    # calculation is the van der Waals radii set, and an unvalidated radii table
    # moves residues across the core/surface boundary invisibly. Validated
    # against published DSSP output in tests/test_sasa.py.
    "biotite>=1.0",
    # Access-token verification. Chosen over hand-decoding because the failure
    # mode of getting it wrong is silent: a JWT is three base64 segments and the
    # signature is the only thing that makes the other two mean anything. PyJWT
    # checks signature, expiry, issuer and audience in one call and is the
    # reference implementation for Python. The [crypto] extra pulls in
    # `cryptography`, which supplies the RSA and ECDSA verification that every
    # OIDC provider's JWKS keys need.
    "pyjwt[crypto]>=2.10",
]

[project.optional-dependencies]
# Real predictors. Kept optional because torch plus the ESM-2 checkpoint is
# several gigabytes, and the default image must stay usable on a machine that
# only ever runs the synthetic set. A provider whose runtime is missing declares
# itself unavailable with that reason — it never falls back to another provider.
#
#   pip install -e ".[models]"
models = [
    "torch>=2.2",
    "transformers>=4.40",
]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "mypy>=1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codonlab"]

[tool.ruff]
# Third-party source, pinned to a commit. Reformatting it would destroy the
# diff against upstream that makes the pin auditable.
extend-exclude = ["codonlab/providers/_vendor"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
    # SQLModel/Pydantic field definitions are function calls in class bodies by design.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
# SQLModel's metaclass defeats a handful of strict-mode checks on table classes.
# Everything outside models/ is held to full strict.
[[tool.mypy.overrides]]
module = "codonlab.models.*"
disallow_untyped_defs = true
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "rq.*", "alembic.*", "biotite.*", "torch.*", "transformers.*",
    "huggingface_hub.*", "codonlab.providers._vendor.*",
]
ignore_missing_imports = true

# Vendored third-party source is not ours to type. See _vendor/README.
[[tool.mypy.overrides]]
module = "codonlab.providers._vendor.*"
ignore_errors = true

# Biotite's AtomArray is a runtime-typed container: attribute access returns Any
# because the annotation categories are dynamic. Confined to the one module that
# touches coordinates.
[[tool.mypy.overrides]]
module = "codonlab.features.structure"
disallow_any_expr = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
