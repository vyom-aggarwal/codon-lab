# `docker compose up` should bring the whole stack up with seed data on a clean
# machine, first try. The api service runs migrations and seeds before serving.

name: codon-lab

# The api and the worker are the same image with the same configuration and two
# different commands. Shared here rather than copied, because a worker whose
# provider set has drifted from the API's would write numbers the API describes
# incorrectly — and the drift would be invisible.
x-api-environment: &api-environment
  DATABASE_URL: postgresql+psycopg://codonlab:codonlab@postgres:5432/codonlab
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: http://localhost:3000
  CODONLAB_PROVIDERS: mock
  # Read from .env in this directory, which git ignores. Empty is fine and
  # selects the deterministic fallback parser.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CODONLAB_PARSER_MODEL: ${CODONLAB_PARSER_MODEL:-claude-opus-5}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codonlab
      POSTGRES_PASSWORD: codonlab
      POSTGRES_DB: codonlab
    ports:
      # Host port 5433 by default: 5432 is commonly taken by another project's
      # database or a local Postgres install. Inside the compose network the
      # api service still reaches this on 5432 by service name, so only host
      # tooling (psql, a GUI client, the api run outside Docker) sees 5433.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codonlab -d codonlab']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment: *api-environment
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    command: >
      sh -c "alembic upgrade head
      && python -m codonlab.seed
      && uvicorn codonlab.main:app --host 0.0.0.0 --port 8000 --reload"

  # Design runs execute here, never in a request handler. The API enqueues and
  # returns; without this container a run stays queued forever, which /queue
  # reports so the run view can say so rather than spin.
  worker:
    build:
      context: ./apps/api
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Migrations run in the api service, so the worker waits for it rather
      # than racing it to a schema that does not exist yet.
      api:
        condition: service_started
    volumes:
      - ./apps/api:/app
    command: python -m codonlab.workers.worker

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    environment:
      # The browser reaches the API on the published host port...
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # ...but server components run inside this container, where localhost is
      # the web container itself. They must use the compose service name.
      API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: 'true'
    ports:
      - '3000:3000'
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      # Anonymous volumes keep the container's installed dependencies from being
      # shadowed by the host bind mount above.
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    command: pnpm --filter @codonlab/web dev

volumes:
  postgres-data:
